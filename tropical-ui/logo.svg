<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Outer Ring (Orbital) -->
  <circle cx="50" cy="50" r="45" stroke="#863bff" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  <!-- The Core (Solar) -->
  <rect x="35" y="35" width="30" height="30" rx="4" fill="#863bff">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </rect>
  <!-- Orbiting Node -->
  <circle cx="85" cy="50" r="6" fill="#f59e0b" />
  <!-- Technical Grid lines -->
  <path d="M20 50H80M50 20V80" stroke="#863bff" stroke-width="1" opacity="0.2"/>
  <!-- Tropical Accent -->
  <path d="M40 35L50 25L60 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
