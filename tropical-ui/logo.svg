<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Sky / Atmosphere (Blue Technical Orbits) -->
  <circle cx="50" cy="10" r="30" stroke="#0ea5e9" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
  <circle cx="50" cy="0" r="45" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
  
  <!-- The Setting Sun (The Core) -->
  <circle cx="50" cy="55" r="22" fill="url(#sunset-grad)">
    <animate attributeName="cy" values="55;57;55" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- BCS Coastline / Mountains (Brown / Cafe) -->
  <path d="M0 75L20 62L40 75L65 58L85 75L100 70V100H0V75Z" fill="#78350f" opacity="0.9"/>
  <!-- Mountain highlights for depth -->
  <path d="M20 62L40 75L65 58" stroke="#92400e" stroke-width="1" opacity="0.5"/>

  <!-- Ocean Reflection (Reactive Lines) -->
  <rect x="30" y="82" width="40" height="1.5" rx="0.75" fill="#f59e0b" opacity="0.8">
    <animate attributeName="width" values="40;55;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="30;22.5;30" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Technical Overlay / Grid -->
  <path d="M0 75H100" stroke="white" stroke-width="0.5" opacity="0.2"/>
  <path d="M50 0V100" stroke="#0ea5e9" stroke-width="0.2" opacity="0.1"/>

  <defs>
    <linearGradient id="sunset-grad" x1="50" y1="35" x2="50" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" /> <!-- Pitahaya Red -->
      <stop offset="100%" stop-color="#f59e0b" /> <!-- Mango Orange -->
    </linearGradient>
  </defs>
</svg>
